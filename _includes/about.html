<div class="user-details">
  <h1 id="about-heading">{{ site.data.expertise.intro_title }}</h1>
  <p>{{ site.user_description }}</p>
</div>
<div class="user" role="list">
  {% for section in site.data.expertise.sections %}
  <div class="tech" role="listitem">
    <div class="tech-icons" aria-hidden="true">
      {% for icon in section.icons %}
      <i class="{{ icon }}"></i>
      {% endfor %}
    </div>
    <h2>{{ section.title }}</h2>
    <p>{{ section.body }}</p>
    {% if section.highlight %}
    <span class="tech-highlight">{{ section.highlight }}</span>
    {% endif %}
  </div>
  {% endfor %}
</div>
