version: 2

updates:
  - package-ecosystem: "bundler"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    groups:
      # One catch-all group: every update type, prod and dev, lands in a single PR
      # per cycle. The previous split (dev minor+patch / prod patch) left production
      # minors and all majors ungrouped, and each of those became its own PR --
      # that was the actual source of the PR flood, not the weekly cadence.
      all-dependencies:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    groups:
      # One catch-all group: every update type, prod and dev, lands in a single PR
      # per cycle. The previous split (dev minor+patch / prod patch) left production
      # minors and all majors ungrouped, and each of those became its own PR --
      # that was the actual source of the PR flood, not the weekly cadence.
      all-dependencies:
        patterns: ["*"]

# NOTE: no "github-actions" ecosystem block here on purpose. Dependabot errors on every
# run if that ecosystem is declared while the repo has no .github/workflows/ directory.
